name: BLACKBOX CLEAN1 runner audit

on:
  pull_request:
    branches:
      - Shadlix
    paths:
      - ".github/workflows/blackbox-clean1-runner-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-windows-2022:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Checkout workflow head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false

      - name: Setup Python 3.12.10 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
          architecture: "x64"

      - name: Setup Visual Studio 2022 x64 shell
        uses: egor-tensin/vs-shell@54e4148eac794e4580591c2e0b7750f14b7891fc
        with:
          arch: x64

      - name: Setup Qt 6.9.3
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb
        with:
          version: 6.9.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: qtbase qttools
          modules: qtmultimedia
          cache: true

      - name: Reassert Python 3.12.10 x64 after Qt
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
          architecture: "x64"

      - name: Record runner identity only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'bb-clean1-runner-audit.txt'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = (& $vswhere -latest -products * -property installationVersion | Out-String).Trim()
          $cmake = (Get-Command cmake.exe -ErrorAction Stop).Source
          $ninja = (Get-Command ninja.exe -ErrorAction Stop).Source
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          $qt = (Resolve-Path $env:QT_ROOT_DIR).Path
          $qtver = (& (Join-Path $qt 'bin\qmake.exe') -query QT_VERSION | Out-String).Trim()
          $pyid = & $python -c 'import sys,struct;print("%d.%d.%d"%sys.version_info[:3]);print(struct.calcsize("P")*8)'
          $lines = @(
            "image_version=$env:ImageVersion",
            "image_os=$env:ImageOS",
            "runner_os=$env:RUNNER_OS",
            "powershell=$($PSVersionTable.PSVersion)",
            "vs=$vs",
            "vctools=$($env:VCToolsVersion.TrimEnd('\'))",
            "sdk=$($env:WindowsSDKVersion.TrimEnd('\'))",
            "cmake_path=$cmake",
            "cmake_version=$((& $cmake --version | Select-Object -First 1))",
            "ninja_path=$ninja",
            "ninja_version=$((& $ninja --version | Out-String).Trim())",
            "ninja_sha256=$((Get-FileHash -LiteralPath $ninja -Algorithm SHA256).Hash.ToLowerInvariant())",
            "python_path=$python",
            "python=$($pyid -join '/')",
            "python_sha256=$((Get-FileHash -LiteralPath $python -Algorithm SHA256).Hash.ToLowerInvariant())",
            "qt=$qtver",
            "qt_root=$qt"
          )
          $lines | Tee-Object -FilePath $out
          "BB_RUNNER_AUDIT=$out" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Upload runner audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BLACKBOX_CLEAN1_RUNNER_AUDIT
          path: ${{ env.BB_RUNNER_AUDIT }}
          if-no-files-found: error
          retention-days: 14

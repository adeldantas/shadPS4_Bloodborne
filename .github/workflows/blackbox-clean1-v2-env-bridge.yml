name: BLACKBOX CLEAN1 V2 environment bridge

on:
  pull_request:
    branches:
      - Shadlix
    paths:
      - ".github/contract/BB_CLEAN1_WINDOWS_BUILD_CONTRACT_V2.md"
      - ".github/contract/BB_CLEAN1_CONTRACT_V2_DRIVER.ps1"
      - ".github/contract/run_blackbox_contract_v2.ps1"
      - ".github/contract/BB_CLEAN1_ENV_BRIDGE_DRIVER.ps1"
      - ".github/workflows/blackbox-clean1-v2-env-bridge.yml"
      - "ci-inputs/BB_BLACKBOX_V1_CI_CLEAN1_SOURCE_READY4_2026-09-15.zip"
      - "ci-inputs/BB_BLACKBOX_V1_CI_CLEAN1_SOURCE_READY4_PATCHFIX1_2026-09-15.zip"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackbox-clean1-v2-env-bridge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-clean1-v2-env-bridge:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout workflow head and authenticated inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Stage exact inputs and generate V2 environment bridge
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $head = '${{ github.event.pull_request.head.sha || github.sha }}'
          $env:WORKFLOW_HEAD = $head

          $v1Rel = '.github/contract/BB_CLEAN1_CONTRACT_V1.ps1'
          $v1 = Join-Path $env:GITHUB_WORKSPACE $v1Rel
          $v1Blob = (git -C $env:GITHUB_WORKSPACE rev-parse "$head`:$v1Rel").Trim()
          if ($LASTEXITCODE -ne 0 -or $v1Blob -ne '4560c463208c603472de7fa0200a0283c4e69ca0') { throw "STOP_V2_V1_CONTRACT_IDENTITY blob=$v1Blob" }

          $driver = Join-Path $env:GITHUB_WORKSPACE '.github\contract\BB_CLEAN1_CONTRACT_V2_DRIVER.ps1'
          $bridgeRel = '.github/contract/BB_CLEAN1_ENV_BRIDGE_DRIVER.ps1'
          $bridge = Join-Path $env:GITHUB_WORKSPACE '.github\contract\BB_CLEAN1_ENV_BRIDGE_DRIVER.ps1'
          $bridgeBlob = (git -C $env:GITHUB_WORKSPACE rev-parse "$head`:$bridgeRel").Trim()
          if ($LASTEXITCODE -ne 0 -or $bridgeBlob -ne '33788e1390d44986bef6e7539eb651ad7dd309a0') { throw "STOP_BRIDGE_DRIVER_GIT_BLOB blob=$bridgeBlob" }
          $bridgeStaged = Join-Path $env:RUNNER_TEMP 'BB_CLEAN1_ENV_BRIDGE_DRIVER.ps1'
          $bridgeText = [IO.File]::ReadAllText($bridge).Replace("`r`n", "`n")
          if ($bridgeText.Contains("`r")) { throw 'STOP_BRIDGE_DRIVER_EOL_UNEXPECTED' }
          [IO.File]::WriteAllText($bridgeStaged, $bridgeText, [Text.UTF8Encoding]::new($false))
          Write-Host "CLEAN1_ENV_BRIDGE_DRIVER_SHA256=$((Get-FileHash -LiteralPath $bridgeStaged -Algorithm SHA256).Hash.ToLowerInvariant())"
          $launcherRel = '.github/contract/run_blackbox_contract_v2.ps1'
          $launcher = Join-Path $env:GITHUB_WORKSPACE '.github\contract\run_blackbox_contract_v2.ps1'
          $launcherBlob = (git -C $env:GITHUB_WORKSPACE rev-parse "$head`:$launcherRel").Trim()
          if ($LASTEXITCODE -ne 0 -or $launcherBlob -ne '9b88f5f09828c1731fb7968b46dc379c27d18e60') { throw "STOP_V2_LAUNCHER_GIT_BLOB blob=$launcherBlob" }

          $inputs = Join-Path $env:RUNNER_TEMP 'bb-clean1-inputs'
          New-Item -ItemType Directory -Path $inputs -Force | Out-Null
          $ready = Join-Path $env:GITHUB_WORKSPACE 'ci-inputs\BB_BLACKBOX_V1_CI_CLEAN1_SOURCE_READY4_2026-09-15.zip'
          $fix = Join-Path $env:GITHUB_WORKSPACE 'ci-inputs\BB_BLACKBOX_V1_CI_CLEAN1_SOURCE_READY4_PATCHFIX1_2026-09-15.zip'
          if (-not (Test-Path -LiteralPath $ready) -or -not (Test-Path -LiteralPath $fix)) { throw 'STOP_INPUT_UNAVAILABLE' }
          if ((Get-FileHash $ready -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0b709de7e6c588b76786d8b648d5f669563c0bf45df5ec44a63db56f869e795f') { throw 'STOP_INPUT_READY4_HASH' }
          if ((Get-FileHash $fix -Algorithm SHA256).Hash.ToLowerInvariant() -ne '13144512830870296d297ebbe194dd8a2d30d9c8eb57358654b67392a7824308') { throw 'STOP_INPUT_PATCHFIX1_HASH' }
          Copy-Item -LiteralPath $ready -Destination (Join-Path $inputs 'BB_BLACKBOX_V1_CI_CLEAN1_SOURCE_READY4_2026-09-15.zip')
          Copy-Item -LiteralPath $fix -Destination (Join-Path $inputs 'BB_BLACKBOX_V1_CI_CLEAN1_SOURCE_READY4_PATCHFIX1_2026-09-15.zip')

          # actions/checkout on Windows may materialize text as CRLF. Authenticate the immutable
          # Git blob first, then reconstruct the contract-authorized canonical LF bytes in temp.
          $launcherText = [IO.File]::ReadAllText($launcher)
          $launcherText = $launcherText.Replace("`r`n", "`n")
          if ($launcherText.Contains("`r")) { throw 'STOP_V2_LAUNCHER_EOL_UNEXPECTED' }
          $launcherStaged = Join-Path $env:RUNNER_TEMP 'run_blackbox_contract_v2.ps1'
          [IO.File]::WriteAllText($launcherStaged, $launcherText, [Text.UTF8Encoding]::new($false))
          if ((Get-FileHash -LiteralPath $launcherStaged -Algorithm SHA256).Hash.ToLowerInvariant() -ne '71d6d3f20ddf81881d0d3a9c7eb25dbd6ca783a16bfe319f0cf218d49ce15ac3') { throw 'STOP_V2_LAUNCHER_STAGE_HASH' }

          $effective = Join-Path $env:RUNNER_TEMP 'BB_CLEAN1_CONTRACT_V2_EFFECTIVE.ps1'
          & $driver -SourceContract $v1 -OutputContract $effective
          if ($LASTEXITCODE -ne 0) { throw "STOP_V2_DRIVER exit=$LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $effective -PathType Leaf)) { throw 'STOP_V2_EFFECTIVE_CONTRACT_MISSING' }
          $bridgeEffective = Join-Path $env:RUNNER_TEMP 'BB_CLEAN1_CONTRACT_V2_BRIDGE_EFFECTIVE.ps1'
          & $bridgeStaged -SourceContract $effective -OutputContract $bridgeEffective
          if ($LASTEXITCODE -ne 0) { throw "STOP_BRIDGE_DRIVER exit=$LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $bridgeEffective -PathType Leaf)) { throw 'STOP_BRIDGE_EFFECTIVE_CONTRACT_MISSING' }

          "WORKFLOW_HEAD=$head" | Add-Content -LiteralPath $env:GITHUB_ENV
          "BB_CLEAN1_V2_LAUNCHER=$launcherStaged" | Add-Content -LiteralPath $env:GITHUB_ENV
          "BB_CLEAN1_V2_BRIDGE_EFFECTIVE=$bridgeEffective" | Add-Content -LiteralPath $env:GITHUB_ENV

      - name: Checkout frozen harness 184e040d
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 184e040de310f54024866adc6d5aa540d495a5fa
          fetch-depth: 0
          submodules: false
          clean: true

      - name: Setup Python 3.12.10 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
          architecture: "x64"

      - name: Setup Visual Studio 2022 x64 shell
        uses: egor-tensin/vs-shell@54e4148eac794e4580591c2e0b7750f14b7891fc
        with:
          arch: x64

      - name: Setup Qt 6.9.3
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb
        with:
          version: 6.9.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: qtbase qttools
          modules: qtmultimedia
          cache: true

      - name: Reassert Python 3.12.10 x64 after Qt
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"
          architecture: "x64"

      - name: Pin canonical Git archive line endings
        shell: pwsh
        run: |
          git -C $env:GITHUB_WORKSPACE config --local core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'STOP_S0_GIT_EOL_CONFIG' }

      - name: Execute accepted CLEAN1 V2 environment bridge S0-S8
        shell: pwsh
        run: |
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'core.symlinks'
          $env:GIT_CONFIG_VALUE_0 = 'false'
          & $env:BB_CLEAN1_V2_BRIDGE_EFFECTIVE -WorkflowHead $env:WORKFLOW_HEAD

      - name: Upload runnable CLEAN1 V2 environment bridge package
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BLACKBOX_V1_CI_CLEAN1_V2_ENV_BRIDGE_WIN64_QT
          path: ${{ runner.temp }}\bb-clean1-contract-v2-bridge\BB_CLEAN1_WIN64_QT.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload V2 environment bridge diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BLACKBOX_V1_CI_CLEAN1_V2_ENV_BRIDGE_DIAGNOSTICS
          path: ${{ runner.temp }}\bb-clean1-contract-v2-bridge\diagnostics
          if-no-files-found: error
          retention-days: 14

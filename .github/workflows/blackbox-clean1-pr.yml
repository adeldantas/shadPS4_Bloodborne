name: BLACKBOX CLEAN1 READY4 PR gate

on:
  pull_request:
    branches:
      - Shadlix
    paths:
      - ".bbx/**"
      - ".github/workflows/blackbox-clean1-pr.yml"

permissions:
  contents: read

jobs:
  windows-clean1:
    runs-on: windows-2022
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Visual Studio 2022 shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Setup Qt 6.9.3
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: qtbase qttools
          modules: qtmultimedia
          cache: false

      - name: Exact replay, gates, build and packaging
        shell: pwsh
        run: ./.bbx/ci/bootstrap_ready4.ps1

      - name: Upload runnable BLACKBOX package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BLACKBOX_V1_CI_CLEAN1_WIN64_QT
          path: ${{ env.RUNTIME_ZIP }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLACKBOX_V1_CI_CLEAN1_DIAGNOSTICS
          path: ${{ runner.temp }}\bbx-diagnostics
          if-no-files-found: warn
          retention-days: 14

name: BLACKBOX CLEAN1 PATCHFIX2 PR gate

on:
  pull_request:
    branches:
      - Shadlix
    paths:
      - ".bbx/**"
      - ".github/workflows/blackbox-clean1-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blackbox-clean1-patchfix2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-clean1:
    runs-on: windows-2022
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Visual Studio 2022 shell
        uses: egor-tensin/vs-shell@v2
        with:
          arch: x64

      - name: Setup Qt 6.9.3
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.9.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          archives: qtbase qttools
          modules: qtmultimedia
          cache: true

      - name: Exact replay, semantic gates, Tier-B build and hardened packaging
        shell: pwsh
        run: ./.bbx/ci/bootstrap_patchfix2.ps1

      - name: Upload runnable PATCHFIX2 package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BLACKBOX_V1_CI_CLEAN1_PATCHFIX2_WIN64_QT
          path: ${{ env.RUNTIME_ZIP }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload PATCHFIX2 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BLACKBOX_V1_CI_CLEAN1_PATCHFIX2_DIAGNOSTICS
          path: ${{ runner.temp }}\bbx-patchfix2-diagnostics
          if-no-files-found: error
          retention-days: 14
